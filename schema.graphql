type Address implements Node {
  address: String
  createdAt: Date!
  id: ID!
  lat: Float
  location: Location!
  long: Float
  name: String
  postalCode: String
  updatedAt: Date!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

scalar DurationType

"""
The `JSONObject` scalar type represents JSON objects as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSONObject

type Location implements Node {
  addresses(after: ID, before: ID, first: Int, last: Int): LocationAddressesConnection!
  city: String!
  country: String!
  createdAt: Date!
  id: ID!
  profiles(after: ID, before: ID, first: Int, last: Int): LocationProfilesConnection!
  state: String
  trips(after: ID, before: ID, first: Int, last: Int): LocationTripsConnection!
  updatedAt: Date!
}

type LocationAddressesConnection {
  edges: [LocationAddressesConnectionEdge]!
  pageInfo: PageInfo!
}

type LocationAddressesConnectionEdge {
  cursor: String!
  node: Address!
}

input LocationInput {
  city: String!
  country: String!
  state: String!
}

type LocationProfilesConnection {
  edges: [LocationProfilesConnectionEdge]!
  pageInfo: PageInfo!
}

type LocationProfilesConnectionEdge {
  cursor: String!
  node: Profile!
}

type LocationTripsConnection {
  edges: [LocationTripsConnectionEdge]!
  pageInfo: PageInfo!
}

type LocationTripsConnectionEdge {
  cursor: String!
  node: Trip!
}

type Mutation {
  createAddress(address: String, lat: Float, locationId: ID!, long: Float, name: String!, postalCode: String): Address!
  createLocation(city: String!, country: String!, profileId: ID, state: String!, tripId: ID): Location!
  createTrip(description: String, location: LocationInput, locationId: String, title: String!): Trip!
  createUser(email: String!, name: String!, tagline: String): User!
  deleteAddress(id: ID!): Address!
  deleteLocation(id: ID!): Location!
  deleteTrip(id: ID!): Trip!
  deleteUser(id: ID!): User!
  editAddress(address: String, id: ID!, lat: Float, long: Float, name: String!, postalCode: String): Address!
  editLocation(city: String, country: String, id: ID!, state: String): Location!
  editTrip(description: String, id: ID!, title: String!): Trip!
}

interface Node {
  id: ID!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

type Profile {
  createdAt: Date!
  description: String
  email: String
  id: String!
  location: Location!
  updatedAt: Date!
  user: User!
}

type Query {
  Address: [Address!]!
  location(id: String!): Location!
  locations: [Location!]!
  me: User!
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  profile(id: String!): Profile!
  profiles: [Profile!]!
  trip(id: String!): Trip!
  trips(me: Boolean): [Trip!]!
  user(id: String!): User!
  users: [User!]!
}

type Trip {
  createdAt: Date!
  description: String
  id: String!
  location: Location!
  title: String!
  updatedAt: Date!
  users(after: ID, before: ID, first: Int, last: Int): TripUsersConnection!
}

type TripUsersConnection {
  edges: [TripUsersConnectionEdge]!
  pageInfo: PageInfo!
}

type TripUsersConnectionEdge {
  cursor: String!
  node: TripsOnUsers!
}

type TripsOnUsers {
  assignedAt: Date!
  id: ID!
  trip: Trip!
  user: User!
}

type User {
  createdAt: Date!
  email: String!
  id: String!
  name: String
  profile: Profile
  tagline: String
  trips(after: ID, before: ID, first: Int, last: Int): UserTripsConnection!
  updatedAt: Date!
}

type UserTripsConnection {
  edges: [UserTripsConnectionEdge]!
  pageInfo: PageInfo!
}

type UserTripsConnectionEdge {
  cursor: String!
  node: TripsOnUsers!
}